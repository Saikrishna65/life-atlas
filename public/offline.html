<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Atlas Vault • Offline Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --card-bg: rgba(16, 19, 26, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.15);
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    /* Ambient Atlas Radial Glow */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 450px;
      background: radial-gradient(ellipse 75% 50% at 50% 0%, rgba(245, 158, 11, 0.08), transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* ==========================================================================
       VIEW 1: BIOMETRIC LOCK SCREEN
       ========================================================================== */
    #viewLock {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .lock-card {
      max-width: 340px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .lock-icon-aura {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05));
      border: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      margin-bottom: 16px;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
    }

    .lock-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 6px;
    }

    .lock-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-biometric {
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b);
      color: #000;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      transition: transform 0.1s;
    }

    .btn-biometric:active {
      transform: scale(0.98);
    }

    .btn-subtle {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      margin-top: 14px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* PIN input pad */
    #pinSection {
      display: none;
      width: 100%;
      margin-top: 12px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pin-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.15s;
    }

    .pin-dot.filled {
      background: var(--accent);
      border-color: #fbbf24;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
      transform: scale(1.15);
    }

    .pin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 220px;
      margin: 0 auto;
    }

    .pin-btn {
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 16px;
      font-family: monospace;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pin-btn:active {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    /* ==========================================================================
       VIEW 2: EXPEDITION VAULT DASHBOARD
       ========================================================================== */
    #viewVault {
      display: none;
      position: relative;
      z-index: 20;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px);
      max-width: 760px;
      margin: 0 auto;
      flex-direction: column;
    }

    .vault-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .nav-btn-lock {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--text);
      color: #000;
      font-weight: 600;
      border-color: var(--text);
    }

    .trip-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .trip-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .trip-status {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .status-active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-planning {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .trip-name {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 400;
      color: #fff;
      margin-bottom: 4px;
    }

    .trip-destination {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .trip-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .trip-budget {
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- VIEW 1: BIOMETRIC LOCK SCREEN -->
  <section id="viewLock">
    <div class="lock-card">
      <div class="lock-badge">
        <span>🛡️ Atlas Vault Protected</span>
      </div>

      <div class="lock-icon-aura">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
          <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
          <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
          <path d="M2 12a10 10 0 0 1 18-6"/>
          <path d="M2 16h.01"/>
          <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
          <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
          <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
          <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
        </svg>
      </div>

      <h1 class="lock-title">Atlas Vault</h1>
      <p class="lock-desc" id="lockDesc">
        Scan your fingerprint to access your offline trip plans, bookings & documents.
      </p>

      <div id="bioSection" style="width: 100%;">
        <button class="btn-biometric" id="btnBioPrompt">
          Verify Fingerprint
        </button>
        <button class="btn-subtle" id="btnTogglePin">
          Enter PIN Code Instead
        </button>
      </div>

      <div id="pinSection">
        <div class="pin-dots">
          <div class="pin-dot" id="dot0"></div>
          <div class="pin-dot" id="dot1"></div>
          <div class="pin-dot" id="dot2"></div>
          <div class="pin-dot" id="dot3"></div>
        </div>

        <div class="pin-grid">
          <button class="pin-btn" onclick="pressPin('1')">1</button>
          <button class="pin-btn" onclick="pressPin('2')">2</button>
          <button class="pin-btn" onclick="pressPin('3')">3</button>
          <button class="pin-btn" onclick="pressPin('4')">4</button>
          <button class="pin-btn" onclick="pressPin('5')">5</button>
          <button class="pin-btn" onclick="pressPin('6')">6</button>
          <button class="pin-btn" onclick="pressPin('7')">7</button>
          <button class="pin-btn" onclick="pressPin('8')">8</button>
          <button class="pin-btn" onclick="pressPin('9')">9</button>
          <button class="pin-btn" onclick="clearPin()" style="font-size: 11px;">CLR</button>
          <button class="pin-btn" onclick="pressPin('0')">0</button>
          <button class="pin-btn" onclick="delPin()" style="font-size: 11px;">⌫</button>
        </div>

        <button class="btn-subtle" id="btnToggleBio" style="margin-top: 14px;">
          Use Fingerprint Sensor
        </button>
      </div>
    </div>
  </section>

  <!-- VIEW 2: EXPEDITION VAULT DASHBOARD -->
  <section id="viewVault">
    <nav class="vault-nav">
      <div class="lock-badge" style="margin-bottom: 0;">
        <span>Offline Vault</span>
      </div>
      <button class="nav-btn-lock" onclick="lockVault()">
        🔒 Lock
      </button>
    </nav>

    <div style="margin-bottom: 24px;">
      <h1 class="lock-title" style="font-size: 32px; text-align: left;">Expedition Vault</h1>
      <p class="lock-desc" style="text-align: left; margin-bottom: 0;">Offline travel command center. View itineraries, tickets, and reservations.</p>
    </div>

    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterTrips('ALL', this)">All Expeditions</button>
      <button class="tab-btn" onclick="filterTrips('ACTIVE', this)">Active</button>
      <button class="tab-btn" onclick="filterTrips('COMPLETED', this)">Completed</button>
    </div>

    <div id="tripsContainer">
      <div style="padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px;">
        Loading local expeditions...
      </div>
    </div>
  </section>

  <script>
    let isVaultUnlocked = false;
    let allTrips = [];
    let currentFilter = 'ALL';
    let pinBuffer = '';
    const DEFAULT_PIN = '1984';

    const viewLock = document.getElementById('viewLock');
    const viewVault = document.getElementById('viewVault');
    const bioSection = document.getElementById('bioSection');
    const pinSection = document.getElementById('pinSection');
    const btnBioPrompt = document.getElementById('btnBioPrompt');
    const btnTogglePin = document.getElementById('btnTogglePin');
    const btnToggleBio = document.getElementById('btnToggleBio');
    const tripsContainer = document.getElementById('tripsContainer');

    // Biometric request
    async function requestDeviceBiometric() {
      if (window.Capacitor) {
        const plugins = window.Capacitor.Plugins || {};
        const bioPlugin = plugins.BiometricAuthNative || plugins.BiometricAuth;
        
        if (bioPlugin) {
          const authMethod = bioPlugin.internalAuthenticate || bioPlugin.authenticate;
          if (typeof authMethod === 'function') {
            return await authMethod.call(bioPlugin, {
              androidTitle: 'Atlas Vault',
              androidSubtitle: 'Touch fingerprint sensor',
              reason: 'Scan fingerprint to access Private Vault',
              cancelTitle: 'Cancel',
              allowDeviceCredential: false,
              androidConfirmationRequired: false
            });
          }
        }

        if (typeof window.Capacitor.nativePromise === 'function') {
          return await window.Capacitor.nativePromise('BiometricAuthNative', 'internalAuthenticate', {
            androidTitle: 'Atlas Vault',
            androidSubtitle: 'Touch fingerprint sensor',
            reason: 'Scan fingerprint to access Private Vault',
            cancelTitle: 'Cancel',
            allowDeviceCredential: false,
            androidConfirmationRequired: false
          });
        }
      }

      return { success: true };
    }

    async function triggerAuth() {
      try {
        btnBioPrompt.innerText = 'Scanning...';
        await requestDeviceBiometric();
        unlockVault();
      } catch (err) {
        btnBioPrompt.innerText = 'Verify Fingerprint';
      }
    }

    function unlockVault() {
      isVaultUnlocked = true;
      viewLock.style.display = 'none';
      viewVault.style.display = 'flex';
      window.scrollTo(0, 0);
      loadOfflineTrips();
    }

    function lockVault() {
      isVaultUnlocked = false;
      pinBuffer = '';
      updatePinDots();
      viewVault.style.display = 'none';
      viewLock.style.display = 'flex';
      btnBioPrompt.innerText = 'Verify Fingerprint';
      window.scrollTo(0, 0);
    }

    // PIN Handlers
    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('dot' + i);
        if (dot) {
          if (pinBuffer.length > i) {
            dot.classList.add('filled');
          } else {
            dot.classList.remove('filled');
          }
        }
      }
    }

    function pressPin(digit) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += digit;
      updatePinDots();

      if (pinBuffer.length === 4) {
        const stored = localStorage.getItem('life_atlas_guardian_pin') || DEFAULT_PIN;
        if (pinBuffer === stored) {
          unlockVault();
        } else {
          alert('Incorrect PIN');
          pinBuffer = '';
          updatePinDots();
        }
      }
    }

    function clearPin() {
      pinBuffer = '';
      updatePinDots();
    }

    function delPin() {
      pinBuffer = pinBuffer.slice(0, -1);
      updatePinDots();
    }

    // Toggle Mode
    btnTogglePin.addEventListener('click', () => {
      bioSection.style.display = 'none';
      pinSection.style.display = 'block';
    });

    btnToggleBio.addEventListener('click', () => {
      pinSection.style.display = 'none';
      bioSection.style.display = 'block';
    });

    btnBioPrompt.addEventListener('click', triggerAuth);

    // AUTO PROMPT ON LAUNCH
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        triggerAuth();
      }, 200);
    });

    // IndexedDB Trip Loader
    function loadOfflineTrips() {
      const req = indexedDB.open('life_atlas_trip_vault_db', 1);

      req.onerror = () => {
        tripsContainer.innerHTML = '<div style="padding: 40px 20px; text-align: center; color: #f87171; font-size: 13px;">Unable to read offline database.</div>';
      };

      req.onsuccess = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('trips')) {
          renderTrips([]);
          return;
        }

        const tx = db.transaction('trips', 'readonly');
        const store = tx.objectStore('trips');
        const getAllReq = store.getAll();

        getAllReq.onsuccess = () => {
          allTrips = getAllReq.result || [];
          renderTrips(allTrips);
        };
      };
    }

    function renderTrips(trips) {
      const filtered = trips.filter(t => {
        if (currentFilter === 'ALL') return true;
        if (currentFilter === 'ACTIVE') return t.status === 'ACTIVE' || t.status === 'PLANNING';
        if (currentFilter === 'COMPLETED') return t.status === 'COMPLETED';
        return true;
      });

      if (filtered.length === 0) {
        tripsContainer.innerHTML = `
          <div style="padding: 48px 24px; text-align: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--card-border); border-radius: 16px;">
            No saved expeditions found in your offline vault.<br><br>
            When online, create trips and they will automatically remain cached here for offline access.
          </div>
        `;
        return;
      }

      tripsContainer.innerHTML = filtered.map(t => `
        <div class="trip-card">
          <div class="trip-card-top">
            <span class="trip-status ${t.status === 'ACTIVE' ? 'status-active' : 'status-planning'}">${t.status}</span>
            <span style="font-size: 11px; color: var(--muted);">${t.travelStyle || 'EXPEDITION'}</span>
          </div>
          <h3 class="trip-name">${t.title}</h3>
          <div class="trip-destination">📍 ${t.destination}</div>
          <div class="trip-meta-row">
            <span>${t.startDate ? new Date(t.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''}</span>
            <span class="trip-budget">${t.currency || '₹'} ${(t.budgetTotal || 0).toLocaleString()}</span>
          </div>
        </div>
      `).join('');
    }

    function filterTrips(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTrips(allTrips);
    }
  </script>
</body>
</html>
