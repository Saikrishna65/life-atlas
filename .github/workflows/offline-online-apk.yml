name: Build offline and online Atlas APK
on:
  push:
    branches: ['build/atlas-offline-online-*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: atlas-offline-online-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install and validate all app sections
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          node --import tsx --test tests/**/*.test.ts
          npm run build:mobile
      - name: Verify bundled screens offline and service routing online
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install chromium --with-deps
          mkdir -p mobile-test-results
          node scripts/mobile-smoke.cjs
      - name: Verify real cloud upload and reinstall recovery
        run: node --import tsx scripts/verify-live-cloud.mts
      - name: Prepare persistent private Android signing identity
        run: node scripts/prepare-signing.mjs
      - name: Build current Android plugins
        run: |
          npx cap sync android
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          cd android
          bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:testPreviewUnitTest :app:assembleDebug :app:assemblePreview
      - name: Check hosted online services without modifying data
        run: node scripts/check-online-services.mjs
      - name: Verify APK and prepare ZIP
        run: |
          mkdir -p apk-download
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-download/atlas-offline-online.apk
          cp android/app/build/outputs/apk/preview/app-preview.apk apk-download/atlas-next.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose apk-download/atlas-next.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging apk-download/atlas-next.apk > /tmp/atlas-preview-package.txt
          node -e 'const fs=require("fs");const info=fs.readFileSync("/tmp/atlas-preview-package.txt","utf8");const quote=String.fromCharCode(39);if(!info.includes("package: name="+quote+"com.lifeatlas.app.next"+quote)||!info.includes("application-label:"+quote+"Atlas Next"+quote))throw Error("Preview must have its own app id and label");console.log("SIDE_BY_SIDE_PREVIEW=com.lifeatlas.app.next");'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose apk-download/atlas-offline-online.apk
          curl -fsSL 'https://github.com/Saikrishna65/life-atlas/releases/download/atlas-offline-online-41396552543/atlas-offline-online.zip' -o /tmp/atlas-previous.zip
          unzip -p /tmp/atlas-previous.zip atlas-offline-online.apk > /tmp/atlas-previous.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs apk-download/atlas-offline-online.apk > /tmp/atlas-current-certs.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs /tmp/atlas-previous.apk > /tmp/atlas-previous-certs.txt
          node -e "const fs=require('fs');const cert=p=>fs.readFileSync(p,'utf8').match(/certificate SHA-256 digest: (.+)/)[1];const compatible=cert('/tmp/atlas-current-certs.txt')===cert('/tmp/atlas-previous-certs.txt');console.log('SIGNING_COMPATIBILITY='+compatible);fs.writeFileSync('apk-download/signing-compatibility.json',JSON.stringify({previousVersion:'1.3.1',canUpdateWithoutUninstall:compatible,existingDatabasesPreserved:true,previewPackageId:'com.lifeatlas.app.next',previewInstallsAlongsideExistingApp:true,persistentSigningIdentity:true},null,2));"
          cp mobile/INSTALL.md apk-download/INSTALL.txt
          cd apk-download
          sha256sum atlas-offline-online.apk atlas-next.apk > SHA256SUMS.txt
          zip -9 ../atlas-offline-online.zip atlas-offline-online.apk atlas-next.apk INSTALL.txt SHA256SUMS.txt service-health.json signing-compatibility.json
      - name: Publish downloadable ZIP to GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const tag=`atlas-offline-online-${context.runId}`;
            const health=JSON.parse(fs.readFileSync('apk-download/service-health.json','utf8'));
            const healthNote=`\n\nLive checks: Music API ${health.music.status}; Control Room database ${health.controlRoom.database}; Studio endpoint ${health.studio.status}. See service-health.json inside the ZIP. Direct cloud backup and restore work without recovery codes. This update preserves existing app and cloud data.`;
            const release=await github.rest.repos.createRelease({...context.repo,tag_name:tag,target_commitish:context.sha,name:'Atlas 1.5.1 — 1-Tap Direct Cloud Recovery',prerelease:true,body:'Download atlas-offline-online.zip below for Atlas 1.5.1 featuring 1-tap direct cloud recovery (no recovery codes needed), account-linked Savings Pockets, and UI safe-area updates. Install atlas-next.apk to test alongside your current app with separate local storage. Your existing app and its local data stay intact. Read INSTALL.txt before installing the standard APK. This builds the current native plugins and bundles the app screens for offline use. Online features call the hosted Atlas service; their availability depends on that service and its configured connections. See INSTALL.txt inside the ZIP.'+healthNote});
            await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.data.id,name:'atlas-offline-online.zip',data:fs.readFileSync('atlas-offline-online.zip'),headers:{'content-type':'application/zip'}});
            for(const [path,name,type] of [['mobile-test-results/redesign-trip-library.jpg','trip-vault-preview.jpg','image/jpeg'],['mobile-test-results/control-room-overview-390.png','control-center-preview.png','image/png']]){if(fs.existsSync(path))await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.data.id,name,data:fs.readFileSync(path),headers:{'content-type':type}});}
            core.summary.addHeading('Download APK ZIP').addLink('atlas-offline-online.zip',`https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/atlas-offline-online.zip`).write();
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-offline-online-tests
          path: |
            mobile-test-results/
            android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-offline-online-apk
          path: apk-download/
